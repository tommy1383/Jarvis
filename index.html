<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020a14">
<title>J.A.R.V.I.S.</title>
<style>
:root{
  --c:#5fe3ff; --c2:#1fa9d6; --bg:#020a14; --t:#d8f6ff; --dim:#7fb3c6; --ko:#ff8a7a;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:400 16px/1.5 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:14px 20px 16px;
  background:radial-gradient(ellipse at 50% 34%,#0b2c40 0%,#04121f 46%,var(--bg) 100%)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.grid{position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(95,227,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(95,227,255,.05) 1px,transparent 1px);
  background-size:32px 32px;-webkit-mask-image:radial-gradient(circle at 50% 36%,#000 0%,transparent 68%);mask-image:radial-gradient(circle at 50% 36%,#000 0%,transparent 68%)}
.top{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);position:relative;z-index:1}
.top b{color:var(--c);letter-spacing:.08em;font-weight:600}
.top .dx{display:flex;align-items:center;gap:14px}
.gear{background:none;border:0;padding:6px;margin:-6px;color:var(--dim);cursor:pointer}
.info{width:100%;max-width:640px;margin-top:4px;font-size:12px;color:var(--dim);opacity:.85;min-height:16px}
.reactor{position:relative;width:min(58vw,260px);aspect-ratio:1/1;margin:4vh 0 2.5vh;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:boot .8s cubic-bezier(.2,.9,.3,1.25) both}
.reactor svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 10px rgba(95,227,255,.45))}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.spin.rev{animation-direction:reverse;animation-duration:26s}
.spin.fast{animation-duration:10s}
.core,.liv{transform-box:fill-box;transform-origin:center}
.liv{opacity:0;transition:opacity .1s,transform .1s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes boot{0%{transform:scale(.15) rotate(-90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes breathe{50%{transform:scale(1.2)}}
@keyframes talk{from{transform:scale(.9)}to{transform:scale(1.22)}}
body.ascolto .spin{animation-duration:6s}
body.ascolto .core{animation:breathe 1.1s ease-in-out infinite}
body.ascolto .liv{opacity:.3}
body.pensa .spin{animation-duration:1.4s}
body.pensa .spin.rev{animation-duration:2.2s}
body.parla .core{animation:talk .3s ease-in-out infinite alternate}
.stato{font-size:14px;font-weight:600;letter-spacing:.14em;color:var(--c);text-shadow:0 0 12px rgba(95,227,255,.6);min-height:20px;text-align:center}
.tu{margin-top:12px;font-size:15px;line-height:1.4;color:var(--dim);text-align:center;min-height:20px;max-width:34em}
.risposta{margin-top:10px;width:100%;max-width:36em;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:18px;line-height:1.5;text-align:center;padding:8px 0;
  -webkit-mask-image:linear-gradient(transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.azione{margin-top:6px;font-size:13px;color:var(--c);text-align:center;min-height:18px}
.campo{display:none;width:100%;max-width:34em;gap:8px;margin-top:8px}
.campo.on{display:flex}
.campo input{flex:1;min-width:0;background:rgba(95,227,255,.07);border:1px solid rgba(95,227,255,.4);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.campo button{background:var(--c);color:#02202b;border:0;border-radius:12px;padding:0 16px;font-weight:700}
.hint{margin-top:8px;font-size:13px;color:var(--dim);text-align:center;min-height:18px}
/* impostazioni */
.pannello{position:fixed;inset:0;z-index:20;display:none;overflow-y:auto;background:rgba(2,10,20,.97);padding:calc(env(safe-area-inset-top,0px) + 24px) 22px calc(env(safe-area-inset-bottom,0px) + 28px)}
.pannello.on{display:block}
.pannello form{max-width:520px;margin:0 auto;display:grid;gap:16px}
.pannello h1{margin:0;font-size:24px;letter-spacing:.08em;color:var(--c);font-weight:600}
.pannello p{margin:0;color:var(--dim);font-size:14px}
.pannello label{display:grid;gap:6px;font-weight:600;font-size:15px}
.pannello label span{font-weight:400;color:var(--dim);font-size:13px}
.pannello input,.pannello select{background:rgba(95,227,255,.06);border:1px solid rgba(95,227,255,.35);border-radius:12px;padding:12px 14px;font-size:16px;width:100%}
.riga2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bottoni{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.prim{background:var(--c);color:#02202b;border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer}
.sec{background:none;border:1px solid rgba(95,227,255,.4);border-radius:12px;padding:12px 18px;cursor:pointer}
.errore{color:var(--ko);font-size:14px;min-height:18px}
@media (prefers-reduced-motion:reduce){.spin,.core,.reactor{animation:none!important}}
</style>
</head>
<body>
<div class="grid"></div>
<div class="top"><span><b>J.A.R.V.I.S.</b> Online</span><span class="dx"><span id="ora"></span><button class="gear" id="apriImpostazioni" type="button" aria-label="Impostazioni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></span></div>
<div class="info" id="info"></div>

<div class="reactor" id="reactor" role="button" tabindex="0" aria-label="Parla con Jarvis">
<svg viewBox="0 0 200 200" aria-hidden="true">
  <defs><radialGradient id="g"><stop offset="0" stop-color="#ecfdff"/><stop offset=".35" stop-color="#5fe3ff"/><stop offset="1" stop-color="#5fe3ff" stop-opacity="0"/></radialGradient></defs>
  <circle class="liv" id="liv" cx="100" cy="100" r="99" fill="none" stroke="#5fe3ff" stroke-width="2"/>
  <g class="spin"><circle cx="100" cy="100" r="97" fill="none" stroke="#5fe3ff" stroke-opacity=".4" stroke-width="1" stroke-dasharray="2 5"/></g>

  <g class="spin fast"><circle cx="100" cy="100" r="73" fill="none" stroke="#1fa9d6" stroke-width="7" stroke-dasharray="64 36" stroke-opacity=".75"/></g>
  <g class="spin rev"><circle cx="100" cy="100" r="59" fill="none" stroke="#5fe3ff" stroke-width="1.5" stroke-dasharray="1 4"/></g>
  <circle cx="100" cy="100" r="47" fill="none" stroke="#5fe3ff" stroke-opacity=".45" stroke-width="1"/>
  <g class="core"><circle cx="100" cy="100" r="42" fill="url(#g)" opacity=".6"/><circle cx="100" cy="100" r="25" fill="none" stroke="#5fe3ff" stroke-width="3"/><circle cx="100" cy="100" r="17" fill="#e6fcff"/></g>
</svg>
</div>

    <h1>J.A.R.V.I.S.</h1>

    <div class="riga2">

<script>
"use strict";
// =====================================================================
//  J.A.R.V.I.S. web — versione 1.0
// =====================================================================
var MODELLI = { intelligente: "claude-sonnet-5-5", veloce: "claude-haiku-5-5" };
var VOCE_MODELLO = "eleven_v4", VOCE_RISERVA = "eleven_multilingual_v2";
var NAVIGATORE = "google";            // "google" oppure "apple"
var MAX_STORIA = 8, STORIA_MINUTI = 30;
var GIORNI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
var APP = {
  whatsapp: "whatsapp://", instagram: "instagram://", telegram: "tg://", spotify: "spotify://", youtube: "youtube://",
  facebook: "fb://", linkedin: "linkedin://", netflix: "nflx://", gmail: "googlegmail://", "google maps": "comgooglemaps://",
  mappe: "maps://", mail: "message://", calendario: "calshow://", note: "mobilenotes://", foto: "photos-redirect://",
  musica: "music://", impostazioni: "App-prefs:", "comandi rapidi": "shortcuts://", scriptable: "scriptable://"
};

function $(id) { return document.getElementById(id); }
function pad(n) { return String(n).padStart(2, "0"); }
function oraLocale(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function attesa(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function normale(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim(); }
function sembraSegreto(t) {
  return /sk-[A-Za-z0-9_-]{10,}/.test(t) || /\b(password|passwd|pwd|pin)\b/i.test(t) || /\b(?:\d[ -]?){13,19}\b/.test(t) || /\bIT\d{2}\s?[A-Z]\s?\d{5}\s?\d{5}\s?[0-9A-Z]{12}\b/i.test(t);
}

// ---------------- configurazione e memoria (solo su questo dispositivo) ----------------
function leggi(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function scrivi(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var CONF = leggi("jarvis.conf", null);
var MEM = leggi("jarvis.mem", { fatti: [], storia: [], note: "" });
if (!Array.isArray(MEM.fatti)) MEM.fatti = [];
if (!Array.isArray(MEM.storia)) MEM.storia = [];
function salvaMem() { scrivi("jarvis.mem", MEM); aggiornaInfo(); }

// ---------------- interfaccia ----------------
function stato(cls, etichetta) { document.body.className = cls; $("stato").textContent = etichetta; }
function aggiornaInfo() {
  var modo = (CONF && CONF.modalita === "veloce") ? "Modalità veloce" : "Modalità intelligente";
  $("info").textContent = modo + "  ·  Memoria " + MEM.fatti.length + ((typeof V !== "undefined" && V.errore) ? "  ·  Voce non disponibile" : "");
}
function ora() { var d = new Date(); $("ora").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()); }
ora(); setInterval(ora, 10000);
function pulisci(t) { return String(t).replace(/\*\*|__|`/g, "").replace(/^#+\s*/gm, "").replace(/^\s*[-•*]\s+/gm, "").replace(/https?:\/\/\S+/g, ""); }
function perVoce(t) {
  return String(t)
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
    .replace(/(\d)\s?€/g, "$1 euro").replace(/€\s?(\d[\d.,]*)/g, "$1 euro")
    .replace(/(\d)\s?%/g, "$1 per cento").replace(/(\d)\s?°\s?C\b/g, "$1 gradi").replace(/(\d)\s?°/g, "$1 gradi")
    .replace(/(\d)\s?km\/h/gi, "$1 chilometri orari").replace(/(\d)\s?km\b/gi, "$1 chilometri")
    .replace(/\b(\d{1,2}):00\b/g, "$1").replace(/\b(\d{1,2}):30\b/g, "$1 e mezza").replace(/\b(\d{1,2}):(\d{2})\b/g, "$1 e $2")
    .replace(/(\d)\.(\d{1,2})(?!\d)/g, "$1,$2").replace(/\s*[—–]\s*/g, ", ").replace(/[()]/g, ", ")
    .replace(/\s+([,.!?])/g, "$1").replace(/\s{2,}/g, " ").trim();
}

// ---------------- audio: microfono + contesto audio (permette di parlare senza tocchi) ----------------
var AU = { ctx: null, an: null, buf: null, stream: null };
function preparaAudio() {
  return new Promise(function (fine) {
    var AC = window.AudioContext || window.webkitAudioContext;
    try { if (!AU.ctx && AC) AU.ctx = new AC(); } catch (e) {}
    if (AU.stream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (AU.ctx && AU.ctx.state !== "running" && AU.ctx.resume) AU.ctx.resume();
      fine(!!AU.stream); return;
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (st) {
      AU.stream = st;
      try {
        var src = AU.ctx.createMediaStreamSource(st);
        AU.an = AU.ctx.createAnalyser(); AU.an.fftSize = 1024; src.connect(AU.an);
        AU.buf = new Float32Array(AU.an.fftSize);
      } catch (e) {}
      if (AU.ctx && AU.ctx.state !== "running" && AU.ctx.resume) AU.ctx.resume();
      fine(true);
    }, function () { fine(false); });
  });
}
(function anello() {
  var liv = $("liv");
  if (AU.an && AU.ctx && AU.ctx.state === "running" && document.body.className === "ascolto") {
    AU.an.getFloatTimeDomainData(AU.buf);
    var s = 0; for (var i = 0; i < AU.buf.length; i++) s += AU.buf[i] * AU.buf[i];
    var v = Math.min(1, Math.sqrt(s / AU.buf.length) * 14);
    liv.style.opacity = String(0.3 + v * 0.7); liv.style.transform = "scale(" + (1 + v * 0.07) + ")";
  } else { liv.style.opacity = ""; liv.style.transform = ""; }
  requestAnimationFrame(anello);
})();

// ---------------- voce: ElevenLabs riprodotto con l'audio web ----------------
var V = { coda: [], suona: false, attesaTesto: "", primo: false, ultimo: "", sorgente: null, errore: "", parlato: false, ascoltatori: [] };
function voceAttiva() { return !!(CONF && CONF.eleven) && !V.errore && !!AU.ctx; }
function scaricaBytes(testo, precedente, modello) {
  var body = { text: testo, model_id: modello, voice_settings: { stability: 0.6, similarity_boost: 0.8, style: 0.1, use_speaker_boost: true } };
  if (precedente && /v2/.test(modello)) body.previous_text = precedente.slice(-300);
  return fetch("https://api.elevenlabs.io/v1/text-to-speech/" + encodeURIComponent(CONF.voce || "JBFqnCBsd6RMkjVDRZzb") + "?output_format=mp3_44100_128", {
    method: "POST", headers: { "xi-api-key": CONF.eleven, "content-type": "application/json", "accept": "audio/mpeg" }, body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) {
      if (res.status >= 400 && res.status < 500 && [401, 402, 403, 429].indexOf(res.status) < 0 && modello !== VOCE_RISERVA) {
        VOCE_MODELLO = VOCE_RISERVA; return scaricaBytes(testo, precedente, VOCE_RISERVA);
      }
      return res.text().then(function (t) { throw new Error("ElevenLabs " + res.status + ": " + String(t).slice(0, 120)); });
    }
    return res.arrayBuffer();
  });
}
function scaricaVoce(testo, precedente, modello) {
  return scaricaBytes(testo, precedente, modello).then(function (dati) {
    return new Promise(function (ok, ko) { AU.ctx.decodeAudioData(dati, ok, ko); });
  });
}
function accoda(testo) {
  var pezzo = { testo: testo, buffer: null, errore: null };
  pezzo.pronto = scaricaVoce(testo, V.ultimo, VOCE_MODELLO).then(function (b) { pezzo.buffer = b; }, function (e) { pezzo.errore = e || new Error("errore"); });
  V.ultimo = testo;
  V.coda.push(pezzo);
  if (!V.suona) prossimo();
}
function prossimo() {
  if (!V.coda.length) { V.suona = false; if (document.body.className === "parla") stato("pronto", "Pronto"); avvisaFineVoce(); return; }
  V.suona = true;
  var p = V.coda[0];
  p.pronto.then(function () {
    if (V.coda[0] !== p) return;
    V.coda.shift();
    if (p.errore || !p.buffer) {
      V.errore = String((p.errore && p.errore.message) || "errore");
      $("azione").textContent = "Voce non disponibile: " + V.errore.slice(0, 90);
      aggiornaInfo();
      V.coda = []; V.suona = false; avvisaFineVoce(); return;
    }
    if (AU.ctx.state !== "running" && AU.ctx.resume) AU.ctx.resume();
    var s = AU.ctx.createBufferSource(); s.buffer = p.buffer; s.connect(AU.ctx.destination);
    V.sorgente = s;
    s.onended = function () { V.sorgente = null; prossimo(); };
    V.parlato = true; stato("parla", "Risposta");
    s.start(0);
  });
}
function dici(t) {
  t = perVoce(pulisci(t));
  if (!t || !voceAttiva()) return;
  V.attesaTesto = V.attesaTesto ? V.attesaTesto + " " + t : t;
  if (!V.primo || V.attesaTesto.length >= 140) { var x = V.attesaTesto; V.attesaTesto = ""; V.primo = true; accoda(x); }
}
function svuota() { if (V.attesaTesto && voceAttiva()) { var x = V.attesaTesto; V.attesaTesto = ""; accoda(x); } }
function nuovaRisposta() { V.primo = false; V.ultimo = ""; V.attesaTesto = ""; }
function fermaVoce() { V.coda = []; V.attesaTesto = ""; if (V.sorgente) { try { V.sorgente.stop(); } catch (e) {} } V.sorgente = null; V.suona = false; avvisaFineVoce(); }
function avvisaFineVoce() { var l = V.ascoltatori; V.ascoltatori = []; l.forEach(function (f) { f(); }); }
function fineVoce() { return new Promise(function (r) { if (!V.suona && !V.coda.length && !V.attesaTesto) r(); else V.ascoltatori.push(r); }); }
function diciTutto(t) { nuovaRisposta(); dici(t); svuota(); return fineVoce(); }

// ---------------- ascolto: riconoscimento vocale di Safari ----------------
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var ASC = { r: null, attivo: false, ferma: null };
function ascolta(attesaMax) {
  return new Promise(function (fine) {
    if (!SR) { fine(null); return; }
    var r = new SR(), testo = "", silenzio = null, scaduto = null, finito = false;
    r.lang = "it-IT"; r.interimResults = true; r.continuous = true;
    function chiudi(x) { if (finito) return; finito = true; clearTimeout(silenzio); clearTimeout(scaduto); ASC.attivo = false; ASC.ferma = null; try { r.stop(); } catch (e) {} fine(x); }
    ASC.r = r; ASC.ferma = function () { chiudi(testo.trim()); };
    r.onstart = function () { ASC.attivo = true; stato("ascolto", "In ascolto"); $("hint").textContent = ""; };
    r.onresult = function (e) {

    if (esito.url) { await fineVoce(); window.location.href = esito.url; modo = "tocco"; continue; }
    modo = "seguito";
  }
}
$("reactor").onclick = function () {
  if (V.suona || V.coda.length) { fermaVoce(); stato("pronto", "Pronto"); return; }
  if (ASC.attivo && ASC.ferma) { ASC.ferma(); return; }
  if (AU.ctx && AU.ctx.state !== "running" && AU.ctx.resume) AU.ctx.resume();
  if (CICLO.tocco) { var f = CICLO.tocco; CICLO.tocco = null; $("hint").textContent = ""; f(); }
};
$("reactor").onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("reactor").onclick(); } };

// ---------------- impostazioni ----------------
function apriImpostazioni() {
  var c = CONF || {};
  $("kClaude").value = c.claude || ""; $("kEleven").value = c.eleven || "";
  $("sVoce").value = c.voce || "JBFqnCBsd6RMkjVDRZzb"; $("sModalita").value = c.modalita || "intelligente";
  $("sForma").value = c.forma || "tu"; $("sSaluto").value = c.saluto || "si";
  $("errImp").textContent = ""; $("pannello").className = "pannello on";
}
$("apriImpostazioni").onclick = apriImpostazioni;
$("chiudiImp").onclick = function () { if (CONF) $("pannello").className = "pannello"; };
$("cancellaMem").onclick = function () {
  if (!confirm("Cancellare tutta la memoria di Jarvis su questo dispositivo?")) return;
  MEM = { fatti: [], storia: [], note: "" }; salvaMem(); $("errImp").textContent = "Memoria cancellata.";
};
$("formImp").onsubmit = function (e) {
  e.preventDefault();
  var k = $("kClaude").value.trim();
  if (k.indexOf("sk-ant-") !== 0) { $("errImp").textContent = "La chiave di Claude deve iniziare con sk-ant-."; return; }
  var primo = !CONF;
  CONF = { claude: k, eleven: $("kEleven").value.trim(), voce: $("sVoce").value, modalita: $("sModalita").value, forma: $("sForma").value, saluto: $("sSaluto").value };
  scrivi("jarvis.conf", CONF); V.errore = ""; aggiornaInfo();
  $("pannello").className = "pannello";
  // il tocco su "Salva" sblocca anche l'audio
  var AC = window.AudioContext || window.webkitAudioContext;
  try { if (!AU.ctx && AC) AU.ctx = new AC(); if (AU.ctx.state !== "running") AU.ctx.resume(); } catch (err) {}
  if (primo) ciclo(true);
};

// ---------------- avvio ----------------
aggiornaInfo();
if (!CONF) { stato("pronto", "Configurazione"); apriImpostazioni(); }
else ciclo(true);
</script>
